# MJ Stock & POS — production host reverse proxy (nginx).
#
# Sits in front of the Docker Compose stack and terminates TLS:
#
#   Internet -> this host nginx :443 -> frontend :80 -> /api -> api:8000
#
# The frontend container already serves the SPA and proxies /api to the API
# (see frontend/nginx.conf), so this file only needs to forward to it.
#
# Setup:
#   1. Replace CHANGE_ME.example.com with your real domain (3 places below).
#   2. Point the ssl_certificate paths at your certificate. The paths shown are
#      the Let's Encrypt defaults that `certbot --nginx` / `certbot certonly
#      --webroot` create automatically.
#   3. Copy this file to /etc/nginx/conf.d/mj.conf (or sites-available + symlink)
#      and run:  nginx -t && systemctl reload nginx
#
# The Compose stack must publish the frontend on loopback (the default):
#   FRONTEND_BIND=127.0.0.1   FRONTEND_PORT=80     (infrastructure/.env)
# If nginx runs on a DIFFERENT host than Docker, set FRONTEND_BIND=0.0.0.0 and
# change the upstream `server` line to that host's IP/hostname.

upstream mj_frontend {
    server 127.0.0.1:80;
    keepalive 16;
}

# HTTP: serve the ACME challenge, redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name CHANGE_ME.example.com;

    # certbot webroot (only needed for `certbot certonly --webroot`).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1: `http2 on;`. On older nginx use `listen 443 ssl http2;`.
    http2 on;
    server_name CHANGE_ME.example.com;

    ssl_certificate     /etc/letsencrypt/live/CHANGE_ME.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Enable only after HTTPS is confirmed working.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Match the frontend container's cap (product / shop image uploads).
    client_max_body_size 32m;

    # Hashed SPA build output: cache hard at the edge.
    location /_nuxt/ {
        proxy_pass http://mj_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA + /api + /health all go to the frontend container, which routes them.
    location / {
        proxy_pass http://mj_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Large image uploads: stream the body instead of buffering to disk.
        proxy_request_buffering off;
    }
}
