# Local-only production overlay for Stock & POS on a Windows PC.
#
# Run from this `infrastructure/` folder (where `.env` lives):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# Or double-click "Start Stock POS.bat" in this folder.
#
# Differences from the development defaults:
# - ENVIRONMENT=production / DEBUG=false (boot refuses dev secrets)
# - db / redis / api are NOT published to the host: internal Docker network only
# - frontend binds to FRONTEND_BIND (set to 127.0.0.1 in .env.local.example so
#   the app is reachable from this PC only; set it to a LAN IP or 0.0.0.0 later)
# - no dev bind mounts, no hot reload — images are built once or pulled
# - API health gate: compose waits for GET /health/ready (DB + Redis checks)
#   before the frontend starts
# - CORS for the same-origin localhost frontend
# - RabbitMQ / Celery / MinIO / scheduler containers: never started
#   (the FastAPI in-process scheduler owns all scheduled jobs)

services:
  db:
    ports: !reset []

  redis:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
    healthcheck:
      # Deep health: only "ok" when PostgreSQL and Redis respond.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    # Local-only guarantee: replace the base port list so the app binds to
    # FRONTEND_BIND (127.0.0.1 by default) even if .env is incomplete.
    ports: !override
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy