# MJ Stock & POS Management System — single lean Compose stack.
#
# Services: mj-stock-management-db, mj-stock-management-redis, mj-stock-management-api,
# mj-stock-management-frontend, mj-stock-management-telegram-bot. Nothing else.
# No RabbitMQ and no Celery workers: every scheduled job (daily
# summary) runs inside the API process, and Telegram delivery is in-process.
#
# All infrastructure lives in this `infrastructure/` folder. Every command is
# meant to run **from here** (this directory), where `.env` also lives:
#   cd infrastructure
#   docker compose up -d --build          # build images and start
#   docker compose up -d                  # start (images already built)
#   docker compose down                   # stop (volumes preserved)
#
# Local-only Windows production (single PC; binds 127.0.0.1 by default):
#   double-click "Start Stock POS.bat" in the infrastructure folder.
#
# Production on another host from prebuilt GHCR images (no local build):
#   set IMAGE_REGISTRY / IMAGE_TAG / PULL_POLICY=always in `.env`, then
#   docker compose pull && docker compose up -d
#
# Image names default to the local build (IMAGE_REGISTRY=mj). Set
# IMAGE_REGISTRY=ghcr.io/kimheang-code-it/mj and PULL_POLICY=always in
# `.env` to use registry images instead.
#
# Backend tests (python -m pytest backend/tests) use the host-loopback,
# 127.0.0.1-published dev ports below: PostgreSQL 55432 and Redis 56379
# (see backend/tests/conftest.py).

# Pin the Compose project name so volume/container names are stable regardless
# of the checkout folder. Override with COMPOSE_PROJECT_NAME in `.env`.
name: mj-stock-management

x-api-build: &api-build
  image: ${IMAGE_REGISTRY:-mj}/api:${IMAGE_TAG:-local}
  pull_policy: ${PULL_POLICY:-build}
  build:
    context: ../backend
    dockerfile: Dockerfile

services:
  mj-stock-management-db:
    container_name: mj-stock-management-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mj}
      POSTGRES_DB: ${POSTGRES_DB:-mj}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only: reachable by backend tests on this PC, not the LAN.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mj} -d ${POSTGRES_DB:-mj}"]
      interval: 5s
      timeout: 3s
      retries: 12

  mj-stock-management-redis:
    container_name: mj-stock-management-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      # Loopback only: reachable by backend tests on this PC, not the LAN.
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mj-stock-management-api:
    <<: *api-build
    container_name: mj-stock-management-api
    restart: unless-stopped
    ports:
      # Loopback only: API docs / direct calls from this PC (frontend nginx
      # proxies /api and /health too).
      - "127.0.0.1:${API_HOST_PORT:-8100}:8000"
    volumes:
      - mediadata:/srv/data/media
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mj}:${POSTGRES_PASSWORD:-mj}@mj-stock-management-db:5432/${POSTGRES_DB:-mj}
      REDIS_URL: redis://mj-stock-management-redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me-in-production-0123456789abcdef}
      # 24-hour access token so users stay signed in through the day.
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      TELEGRAM_BOT_CLIENT_ID: ${TELEGRAM_BOT_CLIENT_ID:-mj-telegram-bot}
      TELEGRAM_BOT_CLIENT_SECRET: ${TELEGRAM_BOT_CLIENT_SECRET:-dev-only-telegram-secret-change-me-0123456789abcdef}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      LOCAL_STORAGE_DIR: /srv/data/media
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80}
      CORS_ALLOW_PRIVATE_NETWORKS: ${CORS_ALLOW_PRIVATE_NETWORKS:-false}
      SEED_ADMIN_ENABLED: ${SEED_ADMIN_ENABLED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@gmail.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-123456}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-System Administrator}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
    depends_on:
      mj-stock-management-db:
        condition: service_healthy
      mj-stock-management-redis:
        condition: service_healthy
    healthcheck:
      # Deep health: only "ok" when PostgreSQL and Redis respond.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  mj-stock-management-frontend:
    container_name: mj-stock-management-frontend
    image: ${IMAGE_REGISTRY:-mj}/frontend:${IMAGE_TAG:-local}
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-same-origin}
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
        NUXT_PUBLIC_APP_VERSION: ${NUXT_PUBLIC_APP_VERSION:-1.0.0}
    restart: unless-stopped
    ports:
      # Bind address defaults to this PC only; set FRONTEND_BIND=0.0.0.0 (or a
      # LAN IP) in `.env` to expose the app on the network.
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-80}:80"
    depends_on:
      mj-stock-management-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

  mj-stock-management-telegram-bot:
    container_name: mj-stock-management-telegram-bot
    image: ${IMAGE_REGISTRY:-mj}/telegram-bot:${IMAGE_TAG:-local}
    pull_policy: ${PULL_POLICY:-build}
    build:
      context: ../backend
      dockerfile: Dockerfile.telegram
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mj}:${POSTGRES_PASSWORD:-mj}@mj-stock-management-db:5432/${POSTGRES_DB:-mj}
      REDIS_URL: redis://mj-stock-management-redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_MODE: ${TELEGRAM_BOT_MODE:-polling}
      TELEGRAM_BOT_CLIENT_ID: ${TELEGRAM_BOT_CLIENT_ID:-mj-telegram-bot}
      TELEGRAM_BOT_CLIENT_SECRET: ${TELEGRAM_BOT_CLIENT_SECRET:-dev-only-telegram-secret-change-me-0123456789abcdef}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
    depends_on:
      mj-stock-management-db:
        condition: service_healthy
      mj-stock-management-redis:
        condition: service_healthy
      mj-stock-management-api:
        condition: service_started

volumes:
  pgdata:
    name: mj-stock-management-pgdata
  redisdata:
    name: mj-stock-management-redisdata
  mediadata:
    name: mj-stock-management-mediadata
